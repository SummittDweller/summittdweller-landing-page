<!-- Project-level override of the theme's seo_schema.html: the theme uses
     .Site.Author, which was removed in modern Hugo. Read from
     .Site.Params.author.name (set in config.toml under [params.author]). -->
{{ $author := "" }}{{ with .Site.Params.author }}{{ $author = .name }}{{ end }}
<script type="application/ld+json">
    {
        "@context" : "http://schema.org",
        "@type" : "BlogPosting",
        "mainEntityOfPage": {
             "@type": "WebPage",
             "@id": "{{ .Site.BaseURL }}"
        },
        "articleSection" : "{{ .Section }}",
        "name" : "{{ .Title }}",
        "headline" : "{{ .Title }}",
        "description" : "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
        "inLanguage" : "{{ .Lang }}",
        "author" : "{{ $author }}",
        "creator" : "{{ $author }}",
        "publisher": "{{ $author }}",
        "accountablePerson" : "{{ $author }}",
        "copyrightHolder" : "{{ $author }}",
        "copyrightYear" : "{{ .Date.Format "2006" }}",
        "datePublished": "{{ .Date.UTC.Format "2006-01-02T15:04:05Z" | safeHTML }}",
        "dateModified" : "{{ .Date.UTC.Format "2006-01-02T15:04:05Z" | safeHTML }}",
        "url" : "{{ .RelPermalink }}",
        "wordCount" : "{{ .WordCount }}",
        "keywords" : [ {{ if isset .Params "tags" }}{{ range .Params.tags }}"{{ . }}",{{ end }}{{ end }}"Blog" ]
    }
</script>
